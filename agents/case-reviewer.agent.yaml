#
# The persona below is projected from .claude/agents/case-reviewer.md, which is the single
# source of truth. Editing this file is overwritten on the next run; edit the markdown.
#
# Create once:  ant beta:agents create < agents/case-reviewer.agent.yaml --transform id -r
